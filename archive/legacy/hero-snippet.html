<!-- ===== HTML: ganti bagian background home dengan ini ===== -->
<section class="hero" id="home">
  <video class="hero-video" autoplay muted loop playsinline preload="auto"
         poster="video/poster.jpg">
    <source src="video/bg.mp4" type="video/mp4">
  </video>
  <div class="hero-overlay"></div>

  <div class="hero-content">
    <!-- isi konten home kamu yang lama taruh di sini -->
  </div>
</section>

<style>
.hero{
  position:relative;
  min-height:100vh;
  min-height:100svh;          /* pas di HP (address bar) */
  overflow:hidden;
  display:grid;
  place-items:center;
  background:#000 url("video/poster.jpg") center/cover no-repeat;
}
.hero-video{
  position:absolute; inset:0;
  width:100%; height:100%;
  object-fit:cover;           /* penuh layar, tidak gepeng */
  object-position:center;
  z-index:0;
}
.hero-overlay{               /* biar teks tetap kebaca */
  position:absolute; inset:0; z-index:1;
  background:linear-gradient(rgba(0,0,0,.35), rgba(0,0,0,.55));
}
.hero-content{
  position:relative; z-index:2;
  width:min(92%, 1400px);
  padding:clamp(16px, 4vw, 64px);
  color:#fff;
}
/* hemat baterai jika user mengaktifkan reduce motion */
@media (prefers-reduced-motion: reduce){
  .hero-video{display:none;}
}
</style>
